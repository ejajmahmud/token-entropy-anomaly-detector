[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-entropy-anomaly-detector"
version = "0.1.0"
description = "Statistical anomaly detector identifying prompt injection triggers and adversarial token patterns in model inputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
token-entropy-anomaly-detector = "token_entropy_anomaly_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["token_entropy_anomaly_detector*"]
